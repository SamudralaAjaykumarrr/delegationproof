name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Least privilege by default: only the publish job escalates, and only to
# the minimum scope `gh release create` needs.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run release-gate verification
        run: ./scripts/verify.sh

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: darwin
            goarch: amd64
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          out="delegationproof"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="delegationproof.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "$out" ./cmd/delegationproof
          echo "BIN=$out" >> "$GITHUB_ENV"
      - name: Package archive
        run: |
          set -eu
          name="delegationproof_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          cp "$BIN" "dist/$name/"
          cp LICENSE "dist/$name/LICENSE" 2>/dev/null || echo "LICENSE not present — release blocked until one is added" >&2
          printf 'DelegationProof %s\n\nSource, documentation, and full license text:\nhttps://github.com/%s\n' \
            "${{ github.ref_name }}" "${{ github.repository }}" > "dist/$name/README.txt"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && zip -r "${name}.zip" "$name")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delegationproof_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  checksum:
    name: checksum
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums.txt
        run: |
          set -eu
          cd artifacts
          sha256sum * > checksums.txt
      - name: Upload checksums
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2 # v4.5.0
        with:
          name: checksums
          path: artifacts/checksums.txt
          retention-days: 7

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [verify, build, checksum]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes "DelegationProof $GITHUB_REF_NAME. See checksums.txt to verify downloaded archives (sha256sum -c checksums.txt)."
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
